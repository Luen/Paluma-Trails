# Nightly dependency refresh → reviewed dependency PR → Release Please.
# Production branches remain protected; versioning/publication happen after merge.

name: Nightly minor deps release

on:
  schedule:
    - cron: '17 14 * * *' # ~00:17 AEST
  workflow_dispatch:

concurrency:
  group: nightly-minor-deps-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  COOLDOWN_DAYS: 3

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # Do not replace an update that is still awaiting review.
      - name: Check for pending dependency update
        id: pending
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=chore/nightly-minor-deps
          # Squash merging does not preserve ancestry. Match the merged PR's
          # head SHA before cleaning up its branch, never an unreviewed update.
          merged_head="$(gh pr list --base main --head "$branch" --state merged \
            --limit 1 --json headRefOid --jq '.[0].headRefOid // empty')"
          remote_head="$(git ls-remote --heads origin "$branch" | cut -f1)"
          if [[ -n "$remote_head" && "$remote_head" == "$merged_head" ]]; then
            git push origin --delete "$branch"
          fi
          if git ls-remote --exit-code --heads origin "$branch"; then
            bash tools/open_automation_pr.sh main chore/nightly-minor-deps \
              "fix(deps): nightly in-major dependency update" \
              "Updates dependencies after the 3-day cooldown. Merge after CI passes; Release Please handles the patch version and publication."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.pending.outputs.pending != 'true'
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1
        if: steps.pending.outputs.pending != 'true'

      - uses: actions/setup-node@v7
        if: steps.pending.outputs.pending != 'true'
        with:
          node-version: 24

      - name: Raise in-major ranges (3-day cooldown)
        if: steps.pending.outputs.pending != 'true'
        run: python tools/update_minor_deps.py --cooldown-days "${COOLDOWN_DAYS}"

      - name: Detect constraint-file changes
        if: steps.pending.outputs.pending != 'true'
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              app/pubspec.yaml \
              tools/paluma_cli/pubspec.yaml \
              tools/basemap/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependency ranges already at the newest cooled in-major release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- \
              app/pubspec.yaml \
              tools/paluma_cli/pubspec.yaml \
              tools/basemap/package.json
          fi

      - name: App analyze and test
        if: steps.changes.outputs.changed == 'true'
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Content tooling test
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/paluma_cli
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Brand colour check
        if: steps.changes.outputs.changed == 'true'
        run: python tools/brand/colour_check.py

      - name: Commit dependency update to a review branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/nightly-minor-deps
          git add \
            app/pubspec.yaml app/pubspec.lock \
            tools/paluma_cli/pubspec.yaml tools/paluma_cli/pubspec.lock \
            tools/basemap/package.json
          git commit -m "fix(deps): nightly in-major dependency update"
          git push origin HEAD:refs/heads/chore/nightly-minor-deps

      - name: Open dependency PR and start CI
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          bash tools/open_automation_pr.sh main chore/nightly-minor-deps \
            "fix(deps): nightly in-major dependency update" \
            "Updates dependencies after the 3-day cooldown. Merge after CI passes; Release Please handles the patch version and publication. Delete the branch after merge (or to discard the update)."
