# Nightly in-major dependency refresh on `dev`.
#
# Raises caret ranges in pubspec.yaml / tools/basemap/package.json to the
# newest release that stays inside each dependency's current major (0.x only
# takes patches), skipping versions published in the last COOLDOWN_DAYS so a
# hijacked release has time to be yanked. Constraint files are the intentional
# edit; lockfiles are only re-resolved so CI can still `pub get`.
#
# Pushes straight to `dev` (not `main`) so release-please and the usual
# promote-to-main flow stay in charge of tags and the GHCR image. No-op when
# nothing moved.

name: Nightly minor deps

on:
  schedule:
    - cron: '17 14 * * *' # ~00:17 AEST
  workflow_dispatch:

concurrency:
  group: nightly-minor-deps-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  COOLDOWN_DAYS: 3

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Raise in-major ranges (3-day cooldown)
        run: python tools/update_minor_deps.py --cooldown-days "${COOLDOWN_DAYS}"

      - name: Detect constraint-file changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              app/pubspec.yaml \
              tools/paluma_cli/pubspec.yaml \
              tools/basemap/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependency ranges already at the newest cooled in-major release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- app/pubspec.yaml tools/paluma_cli/pubspec.yaml tools/basemap/package.json
          fi

      - name: App analyze and test
        if: steps.changes.outputs.changed == 'true'
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Content tooling test
        if: steps.changes.outputs.changed == 'true'
        working-directory: tools/paluma_cli
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Brand colour check
        if: steps.changes.outputs.changed == 'true'
        run: python tools/brand/colour_check.py

      - name: Commit and push to dev
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/pubspec.yaml app/pubspec.lock \
            tools/paluma_cli/pubspec.yaml tools/paluma_cli/pubspec.lock \
            tools/basemap/package.json
          git commit -m "chore(deps): nightly in-major dependency update"
          # A PR may have landed on dev while tests ran.
          git pull --rebase origin dev
          git push origin HEAD:dev
