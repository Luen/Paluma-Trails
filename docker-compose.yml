services:
  web:
    image: ghcr.io/luen/paluma-trails-web:${PALUMA_WEB_TAG:-latest}
    build:
      context: ./app
    container_name: paluma-trails-web
    restart: unless-stopped
    ports:
      # Host 8098 avoids clashing with other services on a typical home NAS;
      # override with PALUMA_WEB_PORT=8080 for a plain local run.
      - "${PALUMA_WEB_PORT:-8098}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
