<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline trail map for Paluma Range National Park.">
  <meta name="theme-color" content="#14532D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paluma Trails">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon; the SVG is the same artwork as the launcher icon. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paluma Trails</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash while the Flutter bundle and MapLibre load. The Dart entrypoint
       calls FlutterNativeSplash.remove(), which invokes this function. -->
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #14532D;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14532D;
    }

    #splash img {
      width: 192px;
      height: 192px;
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!-- Supplies the pmtiles:// protocol handler; registered from the app after
       MapLibre GL JS has loaded. -->
  <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="splash.png" alt="">
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
